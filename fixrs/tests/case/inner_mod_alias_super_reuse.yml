name: inner_mod_alias_super_reuse
description: 当嵌套子模块包含 use super::* 时，直接复用外层别名，子模块内部不重复插入别名 use
options:
  extra_crates: ["async_lock"]
input: |
  use async_lock::Mutex as AsyncLockMutex;

  mod inner {
    use super::*;

    pub fn run() {
      let _ = async_lock::Mutex::new(0);
    }
  }
expected: |
  use async_lock::Mutex as AsyncLockMutex;

  mod inner {
    use super::*;

    pub fn run() {
      let _ = AsyncLockMutex::new(0);
    }
  }

name: auto_alias_on_conflict
description: 当两段路径的类型与已有符号冲突时，自动按规范生成无冲突别名（如 AsyncLockMutex）
options:
  extra_crates: ["async_lock", "parking_lot"]
input: |
  use parking_lot::Mutex;

  pub fn run() {
    let _ = async_lock::Mutex::new(0);
  }
expected: |
  use parking_lot::Mutex;
  use async_lock::Mutex as AsyncLockMutex;

  pub fn run() {
    let _ = AsyncLockMutex::new(0);
  }
